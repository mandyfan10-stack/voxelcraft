<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src  'self' 'unsafe-inline';
                 img-src    'self' data: blob:;">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>VoxelFear</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
  <!-- Three.js canvas — fullscreen, sits at z-index 0 under the React overlay -->
  <canvas id="c"></canvas>

  <!-- Legacy DOM stubs — kept for js/main.js / entities.js compatibility; hidden from view -->
  <div id="hud"    style="display:none"></div>
  <div id="hp-bar" style="display:none"><div id="hp-fill"></div><div id="hp-text"></div></div>
  <div id="day-counter" style="display:none"></div>
  <div id="vignette"    style="display:none"></div>
  <div id="ch"   style="display:none"></div>
  <div id="bar"  style="display:none"></div>
  <div id="jb"   style="display:none"><div id="jk"></div></div>
  <div id="jp"   style="display:none">JUMP</div>
  <div id="skull" style="display:none"><span id="skullemoji">💀</span></div>
  <div id="scr"   style="display:none"><img id="scri" src=""/></div>

  <!-- React UI root — fullscreen overlay above the canvas -->
  <div id="root"></div>

  <!-- Bridge must be synchronous — runs before everything else -->
  <script src="js/gamebridge.js"></script>

  <!-- React ecosystem (vendored locally) -->
  <script src="js/vendor/react.production.min.js"></script>
  <script src="js/vendor/react-dom.production.min.js"></script>

  <!-- UI components — pre-compiled from ui/*.jsx via `npm run build:ui` -->
  <script src="ui/voxel-bg.js"></script>
  <script src="ui/creature.js"></script>
  <script src="ui/main-menu.js"></script>
  <script src="ui/hud.js"></script>
  <script src="ui/inventory.js"></script>
  <script src="ui/loot.js"></script>
  <script src="ui/death.js"></script>
  <script src="ui/settings.js"></script>
  <script src="ui/app.js"></script>

  <!-- Three.js game (ES module — loads concurrently; bridge is already ready) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
